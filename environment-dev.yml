name: meteo

channels:
  - conda-forge

dependencies:
  - python=3.12
  # Core data
  - numpy
  - pandas
  - pyarrow
  - duckdb
  # Géosciences
  - pvlib
  # ML utils (BallTree pour sélection multi-stations, cf. geo.py)
  - scikit-learn
  # HTTP
  - requests
  # Config / secrets (App 1 Veille)
  - pyyaml
  - python-dotenv
  # UI app opérationnelle
  - streamlit
  - altair
  # App 3 Climato : Jupyter pour exécution des chunks Python dans le
  # rapport Quarto, matplotlib pour les figures. Quarto lui-même est
  # un binaire séparé (le package conda-forge est cassé en 2026-05) :
  # installer via le tarball officiel ou apt — voir README.
  - jupyter
  - matplotlib
  # Outils de dev
  - pytest
  # Borne chaque test (cf. pyproject [tool.pytest.ini_options] timeout) :
  # un hang (ex. backend matplotlib en CI) échoue vite avec un traceback
  # au point de blocage, au lieu de faire expirer tout le job sans log.
  - pytest-timeout
  - ruff
  - mypy
  - pre-commit
  # Pip pour deps PyPI-only (à compléter au besoin)
  - pip
  # GRIB : lecture du point depuis ARPEGE direct MF Données Publiques (WCS),
  # cf. src/meteo_socle/sources/meteofrance_arpege.py. python-eccodes = bindings
  # Python, eccodes = bibliothèque C + définitions.
  - eccodes
  - python-eccodes
  # ECMWF IFS HRES direct depuis Open Data (cf. ecmwf_opendata.py) : cfgrib lit
  # les GRIB multi-échéances, le client ecmwf-opendata (pip) les télécharge.
  - cfgrib
  # Note: climetlab pour SAFRAN à ajouter quand on attaque l'app climato (cf. ADR-0002).
  - pip:
      # Client de téléchargement ECMWF Open Data (PyPI uniquement).
      - ecmwf-opendata
