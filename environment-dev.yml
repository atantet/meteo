name: meteo

channels:
  - conda-forge

dependencies:
  - python=3.12
  # Core data
  - numpy
  - pandas
  - pyarrow
  - duckdb
  # Géosciences
  - pvlib
  # ML utils (BallTree pour sélection multi-stations, cf. geo.py)
  - scikit-learn
  # HTTP
  - requests
  # Config / secrets (App 1 Veille)
  - pyyaml
  - python-dotenv
  # UI app opérationnelle
  - streamlit
  - altair
  # App 3 Climato : Jupyter pour exécution des chunks Python dans le
  # rapport Quarto, matplotlib pour les figures. Quarto lui-même est
  # un binaire séparé (le package conda-forge est cassé en 2026-05) :
  # installer via le tarball officiel ou apt — voir README.
  - jupyter
  - matplotlib
  # Outils de dev
  - pytest
  - ruff
  - mypy
  - pre-commit
  # Pip pour deps PyPI-only (à compléter au besoin)
  - pip
  # Note: cfgrib / eccodes seront ajoutés en v1 si bascule AROME directe (cf. ADR-0002).
  # Note: climetlab pour SAFRAN à ajouter quand on attaque l'app climato (cf. ADR-0002).
