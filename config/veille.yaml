# Configuration App 1 — Veille email matinal
#
# Défauts publics versionnés. Pour surcharger localement, copier en
# `config/veille.local.yaml` (gitignored) — chaque clé présente dans le
# local écrase le défaut.
#
# Pour les secrets (SMTP, destinataires), utiliser `.env` ou GitHub
# Actions Secrets, jamais ce fichier (cf. ADR-0001 règle 1).

# ----- Site de référence (cf. ADR-0001 règle 3) -----
site:
  # 8 La Petite Claye, 35610 Pleine-Fougères. Géocodage Nominatim OSM.
  latitude: 48.5420
  longitude: -1.6155
  altitude: 30
  # Fuseau horaire affiché dans le mail et utilisé pour les bornes
  # journalières (nuit = 18h → 8h heure locale).
  tz: Europe/Paris

# ----- Planification -----
#
# Le scheduling EFFECTIF est externalisé chez cron-job.org depuis le
# 2026-05-31 (abandon GH Actions schedule pour lag chronique 2-4 h).
# Le job cron-job.org POST sur l'API GH /workflows/veille.yml/dispatches
# avec un PAT fine-grained scope actions:write.
#
# DEUX envois par jour (cf. mail « matin » / « après-midi ») : il faut
# DEUX jobs cron-job.org appelant le même workflow_dispatch, à ~12 h
# d'écart. L'app déduit le moment (matin/après-midi) de l'heure locale
# d'envoi et ancre sa fenêtre 48 h sur la dernière demi-journée (00 h ou
# 12 h locale — cf. apps.veille.indicateurs.ancre_fenetre) ; aucun
# paramètre à passer au workflow.
#
# Les champs ci-dessous restent pour mémoire / documentation — ils ne
# sont plus consommés par .github/workflows/veille.yml (qui n'a plus que
# workflow_dispatch). Pour modifier les heures d'envoi, éditer les jobs
# sur cron-job.org, PAS ce fichier.
planification:
  # Heures cibles documentées des déclenchements externes (UTC), telles
  # que réglées sur cron-job.org (deux jobs, 12 h d'écart) :
  # - matin : 05:30 UTC = 06:30 Paris hiver / 07:30 Paris été. Après
  #   diffusion du run AROME 00 UTC chez Open-Meteo (~03:30-04:00 UTC).
  # - après-midi : 17:30 UTC = 18:30 Paris hiver / 19:30 Paris été. Après
  #   diffusion du run AROME 12 UTC (~15:30 UTC) → données rafraîchies.
  # cron-job.org est précis à la minute.
  cron_utc_matin: "30 5 * * *"
  cron_utc_apres_midi: "30 17 * * *"
  # Désactivable depuis cron-job.org (mettre les jobs en pause).
  actif: true

# ----- Source météo -----
source_meteo:
  # En v0 : Open-Meteo (gratuit, pas d'auth). Voir ADR-0002.
  prevision: openmeteo
  # Modèles explicites (pas best_match, qui est une boîte noire ne
  # révélant pas quel modèle alimente quelle variable — cf. principe
  # « pas de boîte noire »). Fusion par priorité = ordre de la liste
  # (1er prioritaire ; les suivants ne comblent que les NaN). Cf.
  # OpenMeteoForecast._fusionner_modeles.
  #   1. meteofrance_arome_france_hd (1,3 km, MF) : T/HR/vent/pluie/temps.
  #   2. meteofrance_arpege_europe (~0,1°, MF) : COMBLE le rayonnement,
  #      qu'AROME ne fournit pas (shortwave_radiation NaN → casserait
  #      l'ETP socle FAO).
  #   3. ecmwf_ifs025 (ECMWF, 0,25°) : COMBLE la probabilité de pluie,
  #      qu'aucun modèle déterministe MF ne fournit (produit d'ensemble
  #      IFS ENS). ECMWF = modèle global de référence. C'est une donnée
  #      NON Météo-France, signalée comme telle dans le label « Source »
  #      du mail (cf. construire_label_source).
  modeles:
    - meteofrance_arome_france_hd
    - meteofrance_arpege_europe
    - ecmwf_ifs025
  # Horizon plafond Veille = 48 h (AROME France HD couvre 0-48 h).
  horizon_max_jours: 2

# ----- Alertes seuils -----
#
# Auto-critique : ces seuils sont des *valeurs opérationnelles
# couramment citées* (fiches GRAB, CIVAM bio, CTIFL, INRAE, doctrine
# Météo-France vigilance), PAS un consensus scientifique. Ils sont
# justifiés ordre de grandeur mais le seuil pertinent pour VOTRE
# exploitation est à raffiner après une saison de retour terrain.
alertes:
  # Gel : un seul signal couvrant les deux actions terrain — purge du
  # réseau d'irrigation ET voilage des cultures sensibles (P17).
  # Déclenché dès qu'une plage de 6 h (nuit/matin/midi/soir) sur les
  # 48 h atteint le seuil ; comme les 4 plages pavent la journée, cela
  # revient au min sur 48 h ≤ seuil. 4 °C = marge de sécurité avant le
  # premier gel (laisse le temps de purger et de poser les voiles).
  # Une fois purge faite et hors période sensible, mettre actif: false.
  gel:
    actif: true
    # Seuil sur T° min d'une plage de 6 h sur 0-48 h (°C).
    seuil_celsius: 4.0

  # ----- Alertes archivées 2026-05-31 -----
  #
  # canicule, pluie intense et vent fort sont désormais portés par la
  # Vigilance Météo-France (officielle d'État) — une seule méthode par
  # phénomène. Sections gardées en config avec actif: false pour
  # permettre une réactivation rapide si le retour terrain montre que
  # les seuils MF sont trop sévères pour l'usage agro (Vigilance MF
  # se déclenche sur épisode dangereux département ; les seuils
  # ci-dessous étaient calibrés pour des actions agro plus précoces).
  # Le code Python correspondant reste actif et fonctionnel — seul le
  # drapeau actif: false les neutralise.
  canicule_aeration:
    actif: false  # ARCHIVÉ 2026-05-31 — remplacé par Vigilance MF "Canicule"
    # Seuil sur T° max prévue 0-48 h (°C). 25 °C marque le palier où
    # sous tunnel/serre la T° peut largement dépasser les seuils
    # critiques en journée. Doctrine Agrobio35.
    seuil_celsius: 25.0

  canicule_stress:
    actif: false  # ARCHIVÉ 2026-05-31 — remplacé par Vigilance MF "Canicule"
    # Seuil sur T° max prévue 0-24 h (°C). 30 °C = palier opérationnel
    # Agrobio35 (épisode mai 2026 cité : T_max 30-34 °C). Stress
    # thermique : avortement floral, blocage croissance, montée à
    # graine accélérée (salades, épinards, radis), brûlures fruit.
    seuil_celsius: 30.0

  pluie_intense:
    actif: false  # ARCHIVÉ 2026-05-31 — remplacé par Vigilance MF "Pluie-inondation"
    # Seuil sur cumul 24 h (mm). 20 mm/24h commence à lessiver
    # cuivre/soufre et rend les travaux de sol impossibles. Pas de
    # source consensuelle, doctrine opérationnelle.
    seuil_mm_24h: 20.0

  vent_fort:
    actif: false  # ARCHIVÉ 2026-05-31 — remplacé par Vigilance MF "Vent violent"
    # Seuil sur vent max prévu (km/h). 60 km/h fait voler bâches et
    # voiles ; vigilance MF "fort vent intérieur" >70 km/h. Doctrine
    # opérationnelle.
    seuil_kmh: 60.0

  # Risque maladies générique (oïdium, botrytis, alternaria, etc.) —
  # déclenché par une nuit douce (constat météo, PAS un modèle
  # pathogène). Doctrine Agrobio35 : les nuits douces sous abri mal
  # aéré favorisent l'activité microbienne. Condition unique = T° min
  # de la nuit à venir. (L'ancien indicateur mildiou Smith, basé sur
  # l'humectation, a été abandonné : le risque maladie ne repose plus
  # que sur la T° min de nuit.)
  risque_maladies:
    actif: true
    # Seuil T° min nuit prochaine (°C). 15 °C correspond à la borne
    # basse des "nuits douces" citée Agrobio35 (15-20 °C propices).
    t_min_nuit_celsius: 15.0

# ----- Vigilance Météo-France -----
#
# Référence officielle d'État pour les phénomènes dangereux (vent,
# pluie, orages, neige-verglas, canicule, grand froid). Couverture J et
# J+1 (~48 h). Granularité : département.
#
# Authentification : variable d'env METEOFRANCE_TOKEN (clé base64
# "Application ID" du portail https://portail-api.meteofrance.fr —
# partagée avec les autres APIs MF, une seule application = une seule
# clé). Souscription à l'API "Données Publiques Vigilance" requise au
# préalable. Si absente, le bloc Vigilance est silencieusement skippé
# du mail (dégradé gracieux).
vigilance_mf:
  # Code département à 2 chiffres. 35 = Ille-et-Vilaine.
  departement: "35"

# ----- Format email -----
email:
  # html_mobile : table compacte responsive ; alt: texte_simple
  format: html_mobile
  # Template du sujet, variables : {date}, {alertes_count},
  # {alertes_resume}, {moment} ("matin"/"après-midi" — distingue les deux
  # envois du jour, déduit de l'heure locale d'envoi).
  sujet_template: "Veille {moment} {date} — {alertes_resume}"
  # Lien depuis chaque indicateur vers sa "fiche indice" sur Pages
  # (publiée plus tard). Aligne avec le principe #5 transparence.
  inclure_lien_fiches_indices: true
  # URL de base des fiches indices (rapport Climato Quarto sur Pages).
  url_fiches_indices: "https://atantet.github.io/meteo/"

# ----- Diffusion (secrets via .env / GH Actions, pas ici) -----
#
# Le code SMTP est provider-agnostic — voir .env.example pour les
# exemples Gmail (défaut v0), Posteo, OVH. Migration prévue vers compte
# pro 2027-01-01 (provider non décidé), trivialisée par cette
# abstraction.
#
# Variables d'environnement requises :
#   - VEILLE_SMTP_HOST
#   - VEILLE_SMTP_PORT        587 (STARTTLS) typiquement
#   - VEILLE_SMTP_USER        adresse email complète
#   - VEILLE_SMTP_PASSWORD    App Password (Gmail) ou mot de passe (Posteo)
#   - VEILLE_EMAIL_FROM       habituellement = SMTP_USER
#   - VEILLE_EMAIL_TO         destinataire(s), séparés par virgule
diffusion:
  # Si false, le mail est généré et imprimé en log GH Actions sans
  # envoi (mode test). Utile pour valider la mise en page sans bombarder.
  envoi_reel: true
