# Configuration App 3 — Climato & stratégie (Quarto + Pages)
#
# Défauts publics versionnés. Override local : config/climato.local.yaml.

# ----- Site de référence (ADR-0001 règle 3) -----
site:
  latitude: 48.5420
  longitude: -1.6155
  altitude: 30
  tz: Europe/Paris

# ----- Source historique -----
source_meteo:
  # CERRA (Copernicus European Regional Reanalysis, ~5 km Europe)
  # via Open-Meteo Archive. Substitue ERA5 (~25 km) pour mieux capter
  # le gradient côtier breton. Plus simple d'accès que SAFRAN MF
  # (~8 km) qui demande Climatik INRAE + intégration custom.
  # Historique 1984-présent (suffisant pour normale OMM 1991-2020).
  archive: openmeteo
  modele: cerra

# ----- Périodes climatologiques -----
periodes:
  # Normale OMM standard.
  normale_debut: 1991
  normale_fin: 2020
  # Année courante de référence (à comparer aux normales). En MVP
  # statique, on prend 2024 (dernière année complète disponible).
  annee_courante: 2024

# ----- Indicateurs et seuils d'analyse -----
indicateurs:
  # Seuil "jour de gel" (T° min < seuil).
  seuil_gel_celsius: 0.0
  # Seuil "jour de canicule" (T° max > seuil).
  seuil_canicule_celsius: 30.0
  # Seuil "jour pluvieux marquant" (cumul 24 h > seuil).
  seuil_jour_pluvieux_mm: 10.0
  # Seuil "nuit douce" (risque maladie) : T° min journalière ≥ seuil.
  # Aligné sur l'indicateur opérationnel Veille/dashboard (Agrobio35).
  # Remplace l'ancien indicateur Smith mildiou (humectation), abandonné.
  nuit_douce_t_min_celsius: 15.0

# ----- Rapport Quarto -----
rapport:
  titre: "Climatologie locale — La Petite Claye, Pleine-Fougères"
  auteur: "Alexis Tantet"
  sous_titre: "Synthèse 1991-2020 (normale OMM) avec comparaison année courante"
  # Fenêtre de données effectivement utilisée dans le rapport. Par
  # défaut alignée sur la normale OMM 1991-2020 ; override possible en
  # config/climato.local.yaml pour un build plus rapide en dev (ex.
  # 2015-2024 = ~3-5 min vs ~7-10 min pour 30 ans).
  periode_donnees:
    debut: 1991
    fin: 2020
