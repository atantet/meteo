# Configuration App 3 — Climato & stratégie (Quarto + Pages)
#
# Défauts publics versionnés. Override local : config/climato.local.yaml.

# ----- Site de référence (ADR-0001 règle 3) -----
site:
  latitude: 48.5420
  longitude: -1.6155
  altitude: 30
  tz: Europe/Paris

# ----- Source historique -----
source_meteo:
  # Placeholder v0 : ERA5 via Open-Meteo (~25 km). ADR-0002 planifie
  # SAFRAN MF (~8 km) en v1 pour mieux capter le gradient côtier
  # breton. Note : ERA5-Land (~10 km) ne fournit pas shortwave_radiation
  # nécessaire au calcul d'ETP socle — on retombe sur ERA5.
  archive: openmeteo
  modele: era5

# ----- Périodes climatologiques -----
periodes:
  # Normale OMM standard.
  normale_debut: 1991
  normale_fin: 2020
  # Année courante de référence (à comparer aux normales). En MVP
  # statique, on prend 2024 (dernière année complète disponible).
  annee_courante: 2024

# ----- Indicateurs et seuils d'analyse -----
indicateurs:
  # Seuil "jour de gel" (T° min < seuil).
  seuil_gel_celsius: 0.0
  # Seuil "jour de canicule" (T° max > seuil).
  seuil_canicule_celsius: 30.0
  # Seuil "jour pluvieux marquant" (cumul 24 h > seuil).
  seuil_jour_pluvieux_mm: 10.0

# ----- Rapport Quarto -----
rapport:
  titre: "Climatologie locale — La Petite Claye, Pleine-Fougères"
  auteur: "Alexis Tantet"
  sous_titre: "Synthèse 1991-2020 (normale OMM) avec comparaison année courante"
  # Fenêtre de données effectivement utilisée dans le rapport v0 —
  # plus courte que la normale OMM pour limiter le temps de build
  # (~30 s / an via Open-Meteo). Plan v1 : passer à la normale complète
  # 1991-2020 + DRIAS projections.
  periode_donnees:
    debut: 2015
    fin: 2024
