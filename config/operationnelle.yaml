# Configuration App 2 — Opérationnelle (dashboard Streamlit)
#
# Défauts publics versionnés. Pour surcharger localement, copier en
# `config/operationnelle.local.yaml` (gitignored — cf. .gitignore).

# ----- Site de référence (cf. ADR-0001 règle 3) -----
site:
  # 8 La Petite Claye, 35610 Pleine-Fougères (Nominatim OSM).
  latitude: 48.5420
  longitude: -1.6155
  altitude: 30
  tz: Europe/Paris

# ----- Source météo prévision -----
#
# Double-horizon : courte échéance (4 j) avec ARPEGE = mailles fines
# Météo-France pour les guides de décision et les séries temporelles
# (zone de confiance haute). Moyenne échéance (5-7 j) avec ECMWF IFS,
# modèle de référence mondial, pour la tendance étendue et les cartes
# géographiques (au-delà de 4 j, ARPEGE n'est plus disponible et IFS
# garde une bonne valeur d'orientation).
source_meteo:
  prevision: openmeteo
  # Horizon court : 4 j → guides + séries temporelles. Modèle ARPEGE
  # (Open-Meteo `meteofrance_arpege_europe`).
  horizon_court_jours: 4
  modele_court: meteofrance_arpege_europe
  # Horizon long : 7 j → tendance + cartes géographiques. Modèle ECMWF
  # IFS (Open-Meteo `ecmwf_ifs025`).
  horizon_long_jours: 7
  modele_long: ecmwf_ifs025

# ----- Seuils alertes (alignés sur veille.yaml par cohérence) -----
#
# Auto-critique : ces seuils sont des valeurs opérationnelles
# couramment citées (cf. config/veille.yaml pour détail des sources),
# pas un consensus scientifique. Ajustables par retour terrain.
alertes:
  gel:
    actif: true
    seuil_celsius: -2.0
  canicule:
    actif: true
    seuil_celsius: 32.0
  pluie_intense:
    actif: true
    seuil_mm_24h: 20.0
  vent_fort:
    actif: true
    seuil_kmh: 60.0

# ----- Indicateurs informationnels (pas alertes) -----
indicateurs:
  # Risque mildiou tomate sous abri (Smith periods 1956, cf. ADR-0007
  # et ADR-0010). Humectation par proxy HR ≥ seuil (Smith historique).
  mildiou_smith:
    actif: true
    t_min_celsius: 10.0
    hr_seuil: 0.90
    heures_min: 11

# ----- Présentation -----
ui:
  # Titre affiché en haut du dashboard.
  titre: "Opérationnelle — La Petite Claye"
  # Pour expand "vérifier la source" sur chaque indicateur.
  inclure_sources_brutes: true
  # URL des fiches indices détaillées (Pages, à venir).
  url_fiches_indices: ""
