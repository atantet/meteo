# Configuration App 2 — Opérationnelle (dashboard Streamlit)
#
# Défauts publics versionnés. Pour surcharger localement, copier en
# `config/operationnelle.local.yaml` (gitignored — cf. .gitignore).

# ----- Site de référence (cf. ADR-0001 règle 3) -----
site:
  # 8 La Petite Claye, 35610 Pleine-Fougères (BAN).
  latitude: 48.543648
  longitude: -1.611515
  altitude: 30
  tz: Europe/Paris
  # Localisation générale affichée dans le titre de l'atelier irrigation.
  lieu: Pleine-Fougères

# ----- Source météo prévision -----
#
# Double-horizon : courte échéance (4 j) avec ARPEGE = mailles fines
# Météo-France pour les guides de décision et les séries temporelles
# (zone de confiance haute). Moyenne échéance (5-7 j) avec ECMWF IFS,
# modèle de référence mondial, pour la tendance étendue et les cartes
# géographiques (au-delà de 4 j, ARPEGE n'est plus disponible et IFS
# garde une bonne valeur d'orientation).
source_meteo:
  prevision: openmeteo
  # Horizon court : 4 j → guides + séries temporelles. Modèle ARPEGE
  # (Open-Meteo `meteofrance_arpege_europe`).
  horizon_court_jours: 4
  modele_court: meteofrance_arpege_europe
  # Horizon long : 10 j → tendance (ADR-0014 D5). Modèle ECMWF IFS
  # (Open-Meteo `ecmwf_ifs025`, ~15 j dispo ; on plafonne à 10).
  horizon_long_jours: 10
  modele_long: ecmwf_ifs025
  # Source ARPEGE (court terme). `false` = Open-Meteo Single Runs (défaut).
  # `true` = MF Données Publiques en direct (WCS, contourne les trous d'ingestion
  # Open-Meteo) : ~500 requêtes cadencées ~10 min + cache de run ; nécessite le
  # secret METEOFRANCE_DP_BASIC et persister le cache entre les 2 jobs (actions/cache).
  # Activé 2026-06-12 après validation semaine complète (déficit 4 j MF −21,2 vs
  # OM −21,4 mm ; guides actifs identiques).
  arpege_mf_direct: true
  arpege_cache_dir: .cache/arpege
  # Source ECMWF (tendance longue). `false` = Open-Meteo Single Runs (défaut).
  # `true` = ECMWF Open Data en direct (data.ecmwf.int, libre/sans clé ; un seul
  # GRIB multi-échéances, pas de quota) : contourne les trous d'ingestion Open-Meteo
  # (rafales ECMWF en pointillé) + cache de run. OFF par défaut (staging prudent) ;
  # validé : ETP Δ ~3 % vs Open-Meteo, rafales couvertes 100 % vs 94 %.
  ecmwf_opendata_direct: false
  ecmwf_cache_dir: .cache/ecmwf
  # Run ARPEGE MF-direct publié par le mail (asset de release GitHub, écrasé chaque
  # matin), relu par l'atelier irrigation pour NE PAS dépendre d'Open-Meteo (ADR-0020).
  # L'atelier l'utilise en priorité (s'il correspond au run 00Z du jour), sinon repli
  # Open-Meteo. Vide → atelier sur Open-Meteo uniquement.
  arpege_partage_url: https://github.com/atantet/meteo/releases/download/arpege-atelier/arpege_atelier.parquet

# ----- Seuils alertes (alignés sur veille.yaml par cohérence) -----
#
# Auto-critique : ces seuils sont des valeurs opérationnelles
# couramment citées (cf. config/veille.yaml pour détail des sources),
# pas un consensus scientifique. Ajustables par retour terrain.
alertes:
  gel:
    actif: true
    seuil_celsius: -2.0
  canicule:
    actif: true
    seuil_celsius: 32.0
  pluie_intense:
    actif: true
    seuil_mm_24h: 20.0
  vent_fort:
    actif: true
    seuil_kmh: 60.0

# Risque maladie : plus d'indicateur Smith mildiou (humectation abandonnée).
# Le risque maladie est désormais un guide « nuit douce » (T° min ≥ seuil), cf.
# decisions.regle_risque_maladie ; son seuil vit dans config/exploitation.yaml
# (seuils_maladie.nuit_douce_t_min_celsius, défaut 15 °C).

# ----- Présentation -----
ui:
  # Titre affiché en haut du dashboard.
  titre: "Opérationnelle — La Petite Claye"
  # Pour expand "vérifier la source" sur chaque indicateur.
  inclure_sources_brutes: true
  # URL des fiches indices détaillées (Pages, à venir).
  url_fiches_indices: ""
