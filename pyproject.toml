[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meteo_socle"
version = "0.0.1"
description = "Socle Python pour les apps météo de La Petite Claye des Champs"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Alexis Tantet"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "RET", # return statements
  "SIM", # simplification
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
# meteofrance.py contient encore du code verbatim hérité de
# app-bilan-hydrique (cf. ADR-0003). Les warnings B/E/UP correspondants
# seront purgés lors de l'enrichissement des fonctions IO et helpers en
# Phase B step 3+.
"src/meteo_socle/sources/meteofrance.py" = [
  "B006",   # mutable-argument-default
  "B007",   # unused-loop-control-variable
  "B028",   # no-explicit-stacklevel
  "E731",   # lambda-assignment
  "UP031",  # printf-string-formatting
  "RET504", # unnecessary assignment before return (verbatim helpers)
  "N806",   # variable naming repJson (verbatim, à corriger Phase B step 3)
]
# Les notebooks et scripts one-shot ont des règles relâchées.
"scripts/*.py" = ["E402"]  # imports après sys.path modification
"tests/**/*.py" = ["B008"]  # appel fonction dans defaults (fixtures pytest)

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
# Strict progressif : warn_return_any et autres règles s'activeront
# module par module via [[tool.mypy.overrides]] au fur et à mesure des
# Phase B step 3+ enrichissements.

[[tool.mypy.overrides]]
module = ["pytz", "pvlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Borne chaque test : un hang (backend matplotlib en CI, etc.) échoue vite
# avec un traceback au point de blocage, au lieu d'expirer tout le job CI
# (cancel à 15 min, aucun log utile). Méthode signal (SIGALRM) sur Linux.
timeout = 120
markers = [
  "golden: characterization tests fixant le comportement migré (cf. ADR-0003)",
]
