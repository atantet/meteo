name: CI tests

# Déclencheurs : push sur main + PR + manuel.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel les runs précédents sur la même branche si un nouveau commit
# arrive (utile pour les pushs rapides successifs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup conda env meteo
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: meteo
          environment-file: environment.yml
          auto-activate-base: false
          use-mamba: true

      - name: Run pytest
        run: pytest tests/ -v --tb=short

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy on src/
        run: mypy src/
