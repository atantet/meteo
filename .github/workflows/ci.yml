name: CI tests

# Déclencheurs : push sur main + PR + manuel.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel les runs précédents sur la même branche si un nouveau commit
# arrive (utile pour les pushs rapides successifs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Backend matplotlib non-interactif : l'env contient PySide6, dont le backend
    # qtagg bloque à l'import de pyplot en runner headless (→ hang jusqu'au timeout).
    env:
      MPLBACKEND: Agg
      # Sur un éventuel hang (SIGABRT du wrapper `timeout` ci-dessous), Python
      # dumpe les stacks de TOUS les threads → on voit enfin OÙ ça bloque.
      PYTHONFAULTHANDLER: "1"
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup conda env meteo
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: meteo
          environment-file: environment-dev.yml
          auto-activate-base: false
          use-mamba: true

      - name: Run pytest
        # Le hang CI intermittent (import matplotlib/Qt, phase de collecte…) se
        # traduisait par un cancel MUET au timeout du job (15 min). On le rend
        # diagnostiquable et rapide :
        # - `--timeout=120 --timeout-method=thread` : borne CHAQUE test à 120 s ;
        #   la méthode thread intercepte aussi les blocages C (la méthode signal,
        #   limitée au thread principal, les rate) et dumpe la stack.
        # - wrapper `timeout --signal=ABRT 600` : filet pour la phase de COLLECTE
        #   (que pytest-timeout ne couvre pas) → SIGABRT + PYTHONFAULTHANDLER
        #   dumpent toutes les stacks avant le cancel du job.
        run: timeout --signal=ABRT 600 pytest tests/ -v --tb=short --timeout=120 --timeout-method=thread

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      # Note : mypy non lancé en CI (pas de pandas-stubs dans
      # environment-dev.yml). Le pre-commit hook (.pre-commit-config.yaml)
      # le déclenche localement avec les stubs corrects, suffisant pour
      # bloquer les erreurs de typage avant push.
