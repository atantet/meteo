name: Publier le site (Pages) — climato + état de l'art

# Un seul site GitHub Pages par dépôt : ce workflow assemble TOUT le
# site en une fois et le déploie. Rapport climato à la racine, livre
# « état de l'art » (HTML + PDF) sous /etat-art-climat/.
# GitHub Pages remplaçant l'intégralité du site à chaque déploiement,
# les deux contenus doivent être (re)construits ensemble ici.
#
# Déclencheurs : changement du climato OU de l'état de l'art, manuel,
# et tous les 1ers du mois (rafraîchir le climato).
on:
  push:
    branches: [main]
    paths:
      - "apps/climato/**"
      - "src/meteo_socle/**"
      - "config/climato.yaml"
      - "data/climato/**"
      - "etat-art-climat/**"
      - "environment-dev.yml"
      - ".github/workflows/climato-publish.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"

# Permissions minimales pour le deploy GitHub Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule exécution Pages en cours à la fois — annule les jobs
# antérieurs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Backend matplotlib non-interactif (cf. ci.yml) : évite le hang qtagg headless.
    env:
      MPLBACKEND: Agg
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup conda env meteo
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: meteo
          environment-file: environment-dev.yml
          auto-activate: false
          conda-remove-defaults: true
          use-mamba: true

      - name: Setup Quarto (binaire officiel)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.42"

      - name: Render report.qmd → HTML (climato)
        run: |
          # Quarto exécute les chunks Python via l'env conda meteo.
          quarto render apps/climato/report.qmd --to html

      - name: Installer TinyTeX (PDF de l'état de l'art)
        run: quarto install tinytex

      - name: Render état de l'art → HTML + PDF (livre Quarto)
        # IMPORTANT : rendu DEPUIS le dossier du livre. Lancé depuis la
        # racine, Quarto lit le .env.example de la racine et exige ses
        # variables (dotenvQuartoProfile) — absentes en CI (pas de .env),
        # d'où un échec MissingEnvVarsError. Le livre n'a pas de chunks.
        working-directory: etat-art-climat
        run: quarto render

      - name: Préparer le contenu Pages (site/)
        run: |
          mkdir -p site
          # Climato à la racine du site.
          cp apps/climato/report.html site/index.html
          # Si Quarto produit un dossier _files/, le copier aussi.
          if [ -d apps/climato/report_files ]; then
            cp -r apps/climato/report_files site/
          fi
          # État de l'art (HTML + PDF) sous /etat-art-climat/.
          mkdir -p site/etat-art-climat
          cp -r etat-art-climat/_output/. site/etat-art-climat/

      - name: Upload artifact Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
