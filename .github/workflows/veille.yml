name: Veille email

# Scheduling EXTERNALISÉ chez cron-job.org (compte Alexis).
# Le service appelle POST /actions/workflows/veille.yml/dispatches
# à l'heure prévue. GH Actions schedule a été abandonné le 2026-05-31
# en raison d'un lag chronique de 2-4 h sur ce repo (mail arrivait
# entre 8 h 30 et 10 h Paris au lieu de 6 h-7 h ciblé).
# cron-job.org : précision ~minute, fiabilité éprouvée depuis 2007.
#
# DEUX envois par jour : deux jobs cron-job.org appellent ce même
# workflow_dispatch à ~12 h d'écart (≈04:15 et ≈16:15 UTC). Le run est
# identique ; l'app déduit le moment (matin/après-midi) de l'heure
# d'envoi et rafraîchit les données. Cf. config/veille.yaml planification.
on:
  workflow_dispatch:

# Permissions minimales : juste lire le code (pas de push, pas d'issue
# write). Limite la surface d'attaque si un secret SMTP fuit.
permissions:
  contents: read

jobs:
  veille:
    runs-on: ubuntu-latest
    # Marge pour les re-runs MF (2 × ~1 min + 120 s) + le fetch ARPEGE direct du
    # matin (~10 min, ~500 requêtes WCS cadencées ; l'après-midi sert du cache).
    timeout-minutes: 30
    # Backend matplotlib non-interactif (cf. ci.yml) : évite le hang qtagg headless
    # à l'import de pyplot (charts.py) dans le pipeline du mail.
    env:
      MPLBACKEND: Agg
    defaults:
      run:
        # Active l'env conda dans tous les `run:` du job.
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup conda + env meteo
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: meteo
          environment-file: environment-dev.yml
          auto-activate-base: false
          # Cache l'env pour les exécutions suivantes (~10 s vs ~2 min).
          use-mamba: true

      - name: Vérifier la version Python et les dépendances clés
        run: |
          python --version
          python -c "import pandas, requests, yaml, dotenv; print('deps OK')"

      # Cache du run ARPEGE direct partagé entre les 2 envois du jour (matin/après-midi)
      # : le matin fetch+écrit, l'après-midi sert du cache (clé = jour UTC) → pas de
      # second ~500 requêtes WCS. Sans effet si arpege_mf_direct=false.
      - name: Jour UTC (clé de cache)
        id: jour
        run: echo "val=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Cache ARPEGE direct
        uses: actions/cache@v4
        with:
          path: .cache/arpege
          key: arpege-${{ steps.jour.outputs.val }}

      - name: Exécuter la veille
        env:
          # Tous les secrets injectés depuis Settings → Secrets and
          # variables → Actions. Aucun secret en clair dans ce fichier.
          VEILLE_SMTP_HOST: ${{ secrets.VEILLE_SMTP_HOST }}
          VEILLE_SMTP_PORT: ${{ secrets.VEILLE_SMTP_PORT }}
          VEILLE_SMTP_USER: ${{ secrets.VEILLE_SMTP_USER }}
          VEILLE_SMTP_PASSWORD: ${{ secrets.VEILLE_SMTP_PASSWORD }}
          VEILLE_EMAIL_FROM: ${{ secrets.VEILLE_EMAIL_FROM }}
          VEILLE_EMAIL_TO: ${{ secrets.VEILLE_EMAIL_TO }}
          # Identifiant OAuth Basic des Données Publiques MF (portail-api),
          # pour les modèles directs ARPEGE/AROME. (La Vigilance, elle, passe
          # par le webservice public — pas besoin de cette clé.)
          METEOFRANCE_DP_BASIC: ${{ secrets.METEOFRANCE_DP_BASIC }}
        # Le webservice MF est injoignable par intermittence depuis les runners
        # (timeout connexion datacenter↔MF). On retente MF (laisse passer une
        # coupure courte → vraie prévi MF), puis en dernier recours on replie le
        # 48 h sur ARPEGE Single Runs (--fallback-mf) pour qu'un mail parte quand
        # même. Quand MF répond, la 1ʳᵉ tentative réussit → zéro surcoût.
        run: |
          set +e
          for tentative in 1 2; do
            echo "::group::Veille — tentative $tentative (prévi MF)"
            python -m apps.veille
            code=$?
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then exit 0; fi
            echo "Tentative $tentative échouée (code $code)."
            if [ "$tentative" -lt 2 ]; then echo "Nouvel essai dans 120 s…"; sleep 120; fi
          done
          echo "::group::Veille — repli ARPEGE (MF toujours injoignable)"
          python -m apps.veille --fallback-mf
          code=$?
          echo "::endgroup::"
          exit $code
